<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natsu's Blog</title>
<style>
  :root { --fg:#1a1a1a; --muted:#666; --bg:#fafafa; --link:#0066cc; }
  body { font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--fg); background:var(--bg); max-width:42rem; margin:0 auto; padding:3rem 1.25rem; }
  h1 { margin:0 0 .25rem; }
  .tagline { color:var(--muted); margin:0 0 2.5rem; }
  ul { list-style:none; padding:0; }
  li { margin:0 0 1.5rem; }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .post-title { font-size:1.15rem; font-weight:600; }
  .date { color:var(--muted); font-size:.85rem; display:block; }
  footer { margin-top:3rem; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
  <h1>Natsu's Blog</h1>
  <p class="tagline">Notes, ideas, and things I'm building.</p>

  <ul>
    <li>
      <a class="post-title" href="posts/hello-world.html">Hello, World</a>
      <span class="date">June 24, 2026</span>
    </li>
  </ul>

  <footer>Built with plain HTML · hosted on GitHub Pages</footer>
</body>
</html>
